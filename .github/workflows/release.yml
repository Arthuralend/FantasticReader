name: Build DMG
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: ./make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FantasticReader-dmg
          path: FantasticReader.dmg
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" FantasticReader.dmg --title "FantasticReader ${{ github.ref_name }}" --notes "Скачайте FantasticReader.dmg, откройте и перетащите приложение в Applications. Если macOS блокирует запуск: правый клик → Открыть."
