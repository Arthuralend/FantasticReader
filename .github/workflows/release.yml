name: Build DMG
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: ./make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FantasticReader-dmg
          path: FantasticReader.dmg
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || 'v1.0' }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "${{ github.sha }}" \
            --title "FantasticReader $TAG" \
            --notes "Скачайте FantasticReader.dmg, откройте и перетащите приложение в Applications. Если macOS блокирует запуск - правый клик, Открыть."
          gh release upload "$TAG" FantasticReader.dmg --clobber
